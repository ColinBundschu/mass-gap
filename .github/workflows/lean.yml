name: lean

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Stacked pushes supersede cleanly: one run per ref, the newest
# winning.  Tag refs form their own group, so a tag's run is never
# cancelled by a branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Two Lean worker threads, not one per core: the heavy
    # kernel-decide batteries elaborate at multi-GB peaks, and four
    # concurrent workers exhaust the hosted runner's memory (the
    # build dies by SIGTERM with no Lean error).  Lake schedules its
    # jobs on the Lean task pool, so this caps concurrent module
    # builds; this Lake has no jobs flag.
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5

      # Installs elan and the toolchain pinned by lean/lean-toolchain,
      # then runs `lake build` in lean/; the .lake build directory is
      # cached between runs keyed on the sources.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: false
          build: true
          test: false
          lint: false

      # The axiom read over every constant of both libraries: prints
      # the count and ends in an error if any constant depends on any
      # axiom.  The build above already refuses a `sorry` anywhere
      # (warningAsError in lakefile.toml).
      - name: axiom check
        working-directory: lean
        run: lake env lean AxiomCheck.lean
