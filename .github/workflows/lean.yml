name: lean

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Stacked pushes supersede cleanly: one run per ref, the newest
# winning.  Tag refs form their own group, so a tag's run is never
# cancelled by a branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # One Lean worker (Lake schedules module builds on the Lean
    # task pool): the heaviest modules' kernel checks each peak
    # near 8 GB of resident memory, so two at once would sit at
    # the hosted runner's 16 GB and one per core would oversubscribe
    # it several times over.  The build runs serially at the sum of
    # the modules' times.
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5

      # Installs elan and the toolchain pinned by lean/lean-toolchain,
      # then runs `lake build` in lean/; the .lake build directory is
      # cached between runs keyed on the sources.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: false
          build: true
          test: false
          lint: false

      # The axiom read over every constant of both libraries: prints
      # the count and ends in an error if any constant depends on any
      # axiom.  The build above already refuses a `sorry` anywhere
      # (warningAsError in lakefile.toml).
      - name: axiom check
        working-directory: lean
        run: lake env lean AxiomCheck.lean
